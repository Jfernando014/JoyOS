name: Build JoyOS Launcher APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK with Gradle 8.5
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JoyOSLauncher.apk
          cp prototype_v8_joy.html joy_os_live.html

      - name: Upload JoyOSLauncher APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyOSLauncher-APK
          path: app/build/outputs/apk/debug/JoyOSLauncher.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v8.1.0' }}
          name: "JoyOS v8.1.0 (Release APK & OTA Hot-Update)"
          body: |
            ### 🚀 JoyOS v8.1.0 — Actualizaciones Automáticas OTA & Ecualizador Pro
            - **Sistema OTA Autónomo**: Comprobación directa y descargas automáticas vía Wi-Fi sin cables ni PC.
            - **Hot-Updates en Caliente**: Actualización de interfaz en 3 segundos (`joy_os_live.html`) sin reiniciar la app.
            - **Ecualizador de 5 Bandas**: Curva Bézier fluida, BassBoost dedicado y atenuador inteligente de audio para navegación.
            - **Hardware AC8227L / ZXDZ_01**: Desbloqueo de audio a 48kHz sin limitador de volumen y asignación de prioridad de memoria.
          files: |
            app/build/outputs/apk/debug/JoyOSLauncher.apk
            joy_os_live.html
          prerelease: false
          make_latest: true
