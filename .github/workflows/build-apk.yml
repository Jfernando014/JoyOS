name: Build JoyOS Launcher APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK with Gradle 8.5
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JoyOSLauncher.apk
          cp joy_os_production.html joy_os_live.html

      - name: Upload JoyOSLauncher APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyOSLauncher-APK
          path: app/build/outputs/apk/debug/JoyOSLauncher.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v8.3.0' }}
          name: "JoyOS v8.3.0 (Real Hardware 1280x720 & Safety Exits)"
          body: |
            ### 🚀 JoyOS v8.3.0 — Versión Funcional Real (1280×720 IPS)
            - **Resolución Nativa 1280×720 (9 Pulgadas)**: Adaptado 1:1 al hardware del Chevrolet Joy (`YT090IBNK12018`).
            - **Salidas de Emergencia & Seguridad**: Botones dedicados para abrir Ajustes de Android (`com.android.settings`) y cambiar de Launcher (`ACTION_HOME_SETTINGS`) al instante.
            - **Cajón de Aplicaciones 100% Real**: Consulta y ejecuta directamente las aplicaciones instaladas en la tablet (Z-Link, Radio FM nativa, Maps, Ajustes, etc.).
            - **Gestor de Archivos USB Conectado al Hardware**: Escaneo real de puertos USB de guantera con instalador directo de paquetes APK.
            - **Cero Datos Quemados**: Velocímetro en 0 km/h, RPM en 0, marcha en P/N y telemetría en tiempo real.
            - **100% Offline**: Estilos y fuentes cargados localmente sin depender de internet.
          files: |
            app/build/outputs/apk/debug/JoyOSLauncher.apk
            joy_os_live.html
          prerelease: false
          make_latest: true
