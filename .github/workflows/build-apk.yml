name: Build JoyOS Launcher APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK with Gradle 8.5
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JoyOSLauncher.apk
          cp joy_os_v1_production.html joy_os_live.html

      - name: Upload JoyOSLauncher APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyOSLauncher-APK
          path: app/build/outputs/apk/debug/JoyOSLauncher.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "JoyOS Production v1.0.0 (Official Hardware Release)"
          body: |
            ### 🚀 JoyOS Production v1.0.0 — Versión Oficial para Chevrolet Joy (9" 1280×720)
            - **Diseño Completo e Intacto**: Todo el diseño visual, animaciones y pantallas del prototipo v8 adaptadas a producción.
            - **Salidas de Emergencia y Seguridad**: Botones funcionales para abrir Ajustes de Android (`com.android.settings`) y cambiar de Launcher (`ACTION_HOME_SETTINGS`).
            - **Cajón de Apps 100% Real**: Detección y ejecución nativa de todas las aplicaciones de la pantalla táctil (Z-Link, Radio FM, Maps, etc.).
            - **Gestor de Archivos USB Conectado al Hardware**: Detección del puerto de la guantera con instalación directa de APKs.
            - **Cero Datos Quemados**: Velocímetro en 0 km/h y telemetría en tiempo real por GPS y OBD2.
            - **100% Offline**: Fuentes y estilos cargados localmente en el paquete sin dependencias externas.
          files: |
            app/build/outputs/apk/debug/JoyOSLauncher.apk
            joy_os_live.html
          prerelease: false
          make_latest: true
