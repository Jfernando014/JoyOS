name: Build JoyOS Launcher APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK with Gradle 8.5
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JoyOSLauncher.apk
          cp prototype_v8_joy.html joy_os_live.html

      - name: Upload JoyOSLauncher APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyOSLauncher-APK
          path: app/build/outputs/apk/debug/JoyOSLauncher.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v8.2.0' }}
          name: "JoyOS v8.2.0 (Native Hardware Super Optimizer & OTA)"
          body: |
            ### 🚀 JoyOS v8.2.0 — Optimizador de Hardware Nativo & USB Manager
            - **Super Optimizador de Hardware 100% Nativo**: Ejecuta el script de rendimiento directamente dentro de la app sin requerir PC ni cables ADB.
            - **Audio Sin Límites**: Desbloqueo nativo del limitador de volumen de fábrica (`audio_safe_volume_state = 2`) y escalado a 48kHz.
            - **Suspensión de Bloatware OEM**: Desactiva en segundo plano los launchers de fábrica (`launcher3`, `fyt`, `ts`, `xyauto`) liberando núcleos de CPU y RAM.
            - **Gestor de Archivos USB**: Interfaz dual con temas oscuro y claro, filtros rápidos para APKs y música, e instalador directo.
            - **Sistema OTA Autónomo**: Actualizaciones en caliente y descargas automáticas vía Wi-Fi.
          files: |
            app/build/outputs/apk/debug/JoyOSLauncher.apk
            joy_os_live.html
          prerelease: false
          make_latest: true
