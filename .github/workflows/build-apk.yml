name: Build JoyOS Launcher APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK with Gradle 8.5
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JoyOSLauncher.apk

      - name: Upload JoyOSLauncher APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyOSLauncher-APK
          path: app/build/outputs/apk/debug/JoyOSLauncher.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v8.0.0
          name: "JoyOS v8.0.0 (Release APK)"
          body: |
            ### 🚗 JoyOS v8.0.0 — Android Home Launcher para Chevrolet Joy 2022
            Instalador APK listo para descargar directamente en tu teléfono o pantalla Android (`1024×600`).
            Incluye Ecualizador Gráfico de 5 bandas en tiempo real, Subwoofer por BassBoost, LoudnessEnhancer de alta ganancia, Dirección de sonido en cabina y optimización 100% de hardware sin bloatware.
          files: app/build/outputs/apk/debug/JoyOSLauncher.apk
          prerelease: false
          make_latest: true
