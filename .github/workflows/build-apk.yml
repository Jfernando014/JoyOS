name: Build JoyOS Launcher APK

on:
  push:
    branches: [ "main", "dev" ] # 'dev' solo compila Artifact de prueba; únicamente 'main' o tags 'v*' publican Release
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK with Gradle 8.5
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JoyOSLauncher.apk
          cp joy_os_v1_production.html joy_os_live.html
          APP_VER=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          echo "APP_VER=${APP_VER}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v${APP_VER}" >> "$GITHUB_ENV"
          fi

      - name: Upload JoyOSLauncher APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyOSLauncher-APK
          path: app/build/outputs/apk/debug/JoyOSLauncher.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "JoyOS Production v${{ env.APP_VER }} (Chevrolet Joy · 9\" AC8227L)"
          body: |
            ### 🚀 JoyOS Production v${{ env.APP_VER }} — Chevrolet Joy (9" AC8227L / 1280×720)
            - **OBD2 Vgate iCar Pro Dual (BT Classic SPP + BLE GATT)**: Soporte nativo para `ANDROID-VLINK` e `IOS-VLINK`, RPM, temperatura real de refrigerante, velocidad ECU, voltaje de batería (`ATRV`) y consumo estimado por MAF/MAP.
            - **TPMS USB 433.92 MHz Plug & Play**: Driver USB Serial integrado (`usb-serial-for-android 3.8.1`, sin apps externas) para receptor Jansite/CH340 con lectura individual por rueda (`FL`, `FR`, `RL`, `RR`), temperatura y diagnóstico hex en REA.
            - **Compatibilidad WebView Android 8.1 + UI Multi-DPI**: Tailwind precompilado 100% offline, JS compatible ES2017 y diseño responsive sin recortes en 1280×720, 1280×672, 1080×600, 1024×600, 960×540 y 853×480.
            - **Cero Datos Quemados**: Toda la telemetría parte en estado de espera (`--` / `0 km/h`) hasta recibir señales reales.
          files: |
            app/build/outputs/apk/debug/JoyOSLauncher.apk
            joy_os_live.html
          prerelease: false
          make_latest: true
